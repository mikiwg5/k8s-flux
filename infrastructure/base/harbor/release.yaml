apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor

spec:
  interval: 1h

  chart:
    spec:
      chart: harbor
      version: "1.19.0"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: harbor

  targetNamespace: harbor

  values:
    expose:
      type: clusterIP
      tls:
        enabled: false  # Disable TLS for simpler access
      # Remove certSource and auto section

    externalURL: http://localhost:8443  # Match your port-forward

    persistence:
      enabled: false

    harborAdminPassword: "Harbor12345"

    trivy:
      enabled: true

    database:
      type: internal

    redis:
      type: internal
      
    notary:
      enabled: false