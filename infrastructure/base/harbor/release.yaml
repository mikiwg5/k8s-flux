apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor

spec:
  interval: 1h

  chart:
    spec:
      chart: harbor
      version: "1.19.0"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: harbor

  targetNamespace: harbor

  values:
    expose:
      type: clusterIP
      tls:
        enabled: true
        certSource: auto
        auto:
          commonName: harbor-harbor-core.harbor.svc.cluster.local

    externalURL: https://harbor-harbor-core.harbor.svc.cluster.local

    persistence:
      enabled: false

    harborAdminPassword: "Harbor12345"

    trivy:
      enabled: true

    database:
      type: internal

    redis:
      type: internal
      
    # Disable notary as it's not needed for basic setup
    notary:
      enabled: false