apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor

spec:
  interval: 1h

  chart:
    spec:
      chart: harbor
      version: "1.19.0"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: harbor

  targetNamespace: harbor

  values:
    expose:
      type: clusterIP

    externalURL: http://harbor.local

    persistence:
      enabled: false

    trivy:
      enabled: true

    harborAdminPassword: "Harbor12345"

    database:
      type: internal

    redis:
      type: internal