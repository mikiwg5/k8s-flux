apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor

spec:
  interval: 1h

  chart:
    spec:
      chart: harbor
      version: "1.19.0"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: harbor

  targetNamespace: harbor

  values:
    expose:
      type: nodePort

      tls:
        enabled: false   # IMPORTANT: avoids certificate + DNS issues
        certSource: auto

    # IMPORTANT: remove fake DNS dependency
    externalURL: http://100.100.2.69:31399

    harborAdminPassword: "Harbor12345"

    persistence:
      enabled: false

    trivy:
      enabled: true

    database:
      type: internal

    redis:
      type: internal