apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor

spec:
  interval: 1h

  chart:
    spec:
      chart: harbor
      version: "1.19.0"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: harbor

  targetNamespace: harbor

  values:
    expose:
      type: nodePort

      tls:
        enabled: true
        certSource: auto
        auto:
          commonName: 100.100.2.69   # IMPORTANT: must match reachable IP

    externalURL: https://100.100.2.69:30443

    persistence:
      enabled: false

    harborAdminPassword: "Harbor12345"

    trivy:
      enabled: true

    database:
      type: internal

    redis:
      type: internal