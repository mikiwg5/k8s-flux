apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 1h
  chart:
    spec:
      chart: harbor
      version: "1.19.0"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: harbor
  targetNamespace: harbor
  values:
    expose:
      type: nodePort          # <-- change from clusterIP to nodePort
      tls:
        enabled: false
      nodePort:
        ports:
          http:
            nodePort: 30080   # pick any free port 30000-32767
 
    externalURL: http://100.100.2.75:30080   # use any node IP
 
    persistence:
      enabled: false
 
    harborAdminPassword: "Harbor12345"
 
    trivy:
      enabled: true
 
    database:
      type: internal
 
    redis:
      type: internal
 
    notary:
      enabled: false