
# flux HelmRelease crd for installing nginx ingress controller helm chart
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
  namespace: nginx

spec:
  interval: 1h

  chart:
    spec:
      chart: nginx-ingress
      version: "2.6.0"
      sourceRef:
        kind: HelmRepository
        name: nginx
        namespace: nginx

  targetNamespace: nginx