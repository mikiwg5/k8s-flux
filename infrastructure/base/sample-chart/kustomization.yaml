# infrastructure/base/sample-chart/kustomization.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sample-chart
  namespace: flux-system
spec:
  interval: 5m
  path: ./infrastructure/base/sample-chart
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sample-chart
      namespace: default