apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: harbor-ca-bundle
  namespace: harbor
spec:
  sources:
  - secret:
      name: harbor-ca-secret
      key: tls.crt
  target:
    configMap:
      key: ca-bundle.crt
    namespaceSelector: {}  # Empty object targets all namespaces